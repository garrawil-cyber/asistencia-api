<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Gradiente: azul oscuro → cyan → teal -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0dcaf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente del servidor -->
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e7f3ff;stop-opacity:1" />
    </linearGradient>

    <!-- Patrón de puntos -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.15" />
    </pattern>

    <!-- Patrón de código binario decorativo -->
    <pattern id="binary" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
      <text x="0" y="15" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.08">1010</text>
      <text x="30" y="25" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.08">0110</text>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bgGradient)" />
  <rect width="1200" height="300" fill="url(#dots)" />
  <rect width="1200" height="300" fill="url(#binary)" />

  <!-- Círculos decorativos -->
  <circle cx="1080" cy="70" r="180" fill="#ffffff" opacity="0.06" />
  <circle cx="120" cy="260" r="140" fill="#ffffff" opacity="0.05" />

  <!-- Ícono del servidor -->
  <g transform="translate(80, 60)">
    <!-- Sombra -->
    <ellipse cx="65" cy="195" rx="60" ry="8" fill="#000000" opacity="0.2" />

    <!-- Stack de servidores -->
    <g>
      <!-- Servidor 1 (superior) -->
      <rect x="0" y="0" width="130" height="45" rx="8" fill="url(#serverGradient)" />
      <circle cx="20" cy="22.5" r="5" fill="#20c997" />
      <circle cx="38" cy="22.5" r="5" fill="#ffc107" opacity="0.7" />
      <rect x="55" y="17" width="60" height="4" rx="2" fill="#0d6efd" opacity="0.3" />
      <rect x="55" y="25" width="40" height="4" rx="2" fill="#0d6efd" opacity="0.3" />

      <!-- Servidor 2 (medio) -->
      <rect x="0" y="55" width="130" height="45" rx="8" fill="url(#serverGradient)" />
      <circle cx="20" cy="77.5" r="5" fill="#20c997" />
      <circle cx="38" cy="77.5" r="5" fill="#20c997" />
      <rect x="55" y="72" width="60" height="4" rx="2" fill="#0d6efd" opacity="0.3" />
      <rect x="55" y="80" width="50" height="4" rx="2" fill="#0d6efd" opacity="0.3" />

      <!-- Servidor 3 (inferior) -->
      <rect x="0" y="110" width="130" height="45" rx="8" fill="url(#serverGradient)" />
      <circle cx="20" cy="132.5" r="5" fill="#20c997" />
      <circle cx="38" cy="132.5" r="5" fill="#ffc107" opacity="0.7" />
      <rect x="55" y="127" width="60" height="4" rx="2" fill="#0d6efd" opacity="0.3" />
      <rect x="55" y="135" width="45" height="4" rx="2" fill="#0d6efd" opacity="0.3" />
    </g>

    <!-- Check flotante (indicador de "activo") -->
    <g transform="translate(95, -10)">
      <circle cx="20" cy="20" r="20" fill="#20c997" stroke="#ffffff" stroke-width="3" />
      <path d="M 10 20 L 17 27 L 30 12"
            stroke="#ffffff" stroke-width="4"
            fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Título principal -->
  <text x="280" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Asistencia API
  </text>

  <!-- Subtítulo -->
  <text x="285" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" fill="#ffffff" opacity="0.9">
    Backend · Panel Admin · Kiosko de asistencia docente
  </text>

  <!-- Badges de tecnologías -->
  <g transform="translate(285, 210)">
    <!-- PHP -->
    <rect x="0" y="0" width="75" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="37" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">PHP 8+</text>

    <!-- MySQL -->
    <rect x="85" y="0" width="90" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="130" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">MySQL</text>

    <!-- REST API -->
    <rect x="185" y="0" width="105" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="237" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">REST API</text>
  </g>
</svg>