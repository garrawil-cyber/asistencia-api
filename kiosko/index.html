<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosko de Asistencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .kiosko {
            background: white;
            color: #333;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 { font-size: 32px; margin-bottom: 8px; color: #1e3c72; }
        .subtitulo { color: #666; margin-bottom: 24px; font-size: 16px; }
        .qr-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            margin: 20px 0;
            position: relative;
        }
        .qr-container img {
            width: 400px;
            height: 400px;
            display: block;
        }
        .timer {
            margin-top: 16px;
            font-size: 18px;
            color: #666;
        }
        .barra {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }
        .barra-inner {
            height: 100%;
            background: linear-gradient(90deg, #2a5298, #1e3c72);
            transition: width 1s linear;
        }
        .instruccion {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
        .hora { font-size: 14px; color: #999; margin-top: 12px; }
        .error {
            color: #d32f2f;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="kiosko">
        <h1>📋 Control de Asistencia</h1>
        <p class="subtitulo">Escanea este código con la app</p>

        <div class="qr-container">
            <img id="qrImg" src="" alt="Cargando QR...">
        </div>

        <div class="timer">
            Se renueva en <strong id="contador">60</strong> segundos
        </div>
        <div class="barra">
            <div class="barra-inner" id="barra" style="width: 100%"></div>
        </div>

        <p class="instruccion">Abre tu app → Escanear QR → Listo ✅</p>
        <p class="hora" id="horaActual"></p>
        <p class="error" id="errorMsg"></p>
    </div>

    <script>
    // API_BASE para las llamadas al backend
    const API_BASE = 'http://192.168.0.19/asistencia-api';

    let API_KEY = '';
    let segundosRestantes = 0;
    let totalSegundos = 60;

    // ============================================
    // Cargar API Key desde el backend
    // ============================================
    async function cargarConfiguracion() {
        try {
            const res = await fetch('/asistencia-api/kiosko/config.php');
            const config = await res.json();

            if (config.error) {
                document.getElementById('errorMsg').textContent = 'Error: ' + config.error;
                return false;
            }

            API_KEY = config.api_key;
            return true;
        } catch (e) {
            console.error('Error cargando config:', e);
            document.getElementById('errorMsg').textContent = 'No se pudo cargar la configuración';
            return false;
        }
    }

    // ============================================
    // Cargar el QR actual desde el backend
    // ============================================
    async function cargarQR() {
        try {
            const res = await fetch(`${API_BASE}/api/v1/qr/actual`, {
                headers: { 'X-API-Key': API_KEY }
            });
            const data = await res.json();

            if (data.success) {
                const url = `${API_BASE}${data.data.imagen_url}&t=${Date.now()}`;
                document.getElementById('qrImg').src = url;
                segundosRestantes = data.data.segundos;
                totalSegundos = data.data.segundos;
                document.getElementById('errorMsg').textContent = '';
            } else {
                document.getElementById('errorMsg').textContent =
                    'Error: ' + (data.message || 'desconocido');
            }
        } catch (e) {
            console.error('Error cargando QR:', e);
            document.getElementById('errorMsg').textContent =
                'Error de conexión con el servidor';
        }
    }

    // ============================================
    // Tick del contador
    // ============================================
    function tick() {
        segundosRestantes--;
        if (segundosRestantes < 0) segundosRestantes = 0;

        document.getElementById('contador').textContent = segundosRestantes;

        const pct = (segundosRestantes / totalSegundos) * 100;
        document.getElementById('barra').style.width = pct + '%';

        if (segundosRestantes <= 0) {
            cargarQR();
        }
    }

    // ============================================
    // Actualizar hora actual
    // ============================================
    function actualizarHora() {
        const ahora = new Date();
        document.getElementById('horaActual').textContent =
            ahora.toLocaleString('es-PE', {
                weekday: 'long', year: 'numeric', month: 'long',
                day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
    }

    // ============================================
    // Inicializar el kiosko
    // ============================================
    async function inicializar() {
        const ok = await cargarConfiguracion();
        if (!ok) return;

        await cargarQR();
        setInterval(tick, 1000);
        setInterval(actualizarHora, 1000);
        actualizarHora();
    }

    // Arrancar
    inicializar();
</script>
