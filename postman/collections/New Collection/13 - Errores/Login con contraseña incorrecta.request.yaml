$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
body:
  type: json
  content: '{"username":"admin","password":"mal"}'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 401\", () => pm.response.to.have.status(401));\r

      const r = pm.response.json();\r

      pm.test(\"Mensaje genérico\", () =>
      pm.expect(r.message).to.include(\"Credenciales\"));"
    language: text/javascript
order: 1000
